name: Generate Snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (attempt 1)
        id: generate_snake_attempt_1
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: Kanishkchahar
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Generate snake (attempt 2)
        if: steps.generate_snake_attempt_1.outcome == 'failure'
        uses: Platane/snk@v3
        with:
          github_user_name: Kanishkchahar
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
