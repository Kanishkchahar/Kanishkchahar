<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @keyframes git-pulse {
        0%, 100% { r: 6.5px; opacity: 1; }
        50% { r: 8.5px; opacity: 0.8; }
      }
      @keyframes git-rotate {
        0%, 15% { transform: rotate(0deg); }
        40%, 60% { transform: rotate(-8deg); }
        85%, 100% { transform: rotate(0deg); }
      }
      .git-body {
        transform-origin: 50px 50px;
        animation: git-rotate 4s ease-in-out infinite;
      }
      .git-dot-1 {
        animation: git-pulse 2s ease-in-out infinite;
      }
      .git-dot-2 {
        animation: git-pulse 2s ease-in-out infinite 0.6s;
      }
      .git-dot-3 {
        animation: git-pulse 2s ease-in-out infinite 1.2s;
      }
    </style>
  </defs>
  <g class="git-body">
    <!-- Git diamond background -->
    <rect x="18" y="18" width="64" height="64" rx="14" transform="rotate(45 50 50)" fill="#F05032"/>
    <!-- Git branch lines -->
    <path d="M35 50 L65 50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 35 L50 65" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 50 L65 35" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Git commit nodes -->
    <circle class="git-dot-1" cx="35" cy="50" r="7" fill="#FFFFFF"/>
    <circle class="git-dot-2" cx="65" cy="50" r="7" fill="#FFFFFF"/>
    <circle class="git-dot-3" cx="65" cy="35" r="7" fill="#FFFFFF"/>
  </g>
</svg>
