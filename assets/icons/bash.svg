<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes shell-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      .cursor {
        animation: cursor-blink 1s steps(1) infinite;
      }
      .shell-window {
        transform-origin: 50px 50px;
        animation: shell-pulse 4s ease-in-out infinite;
      }
    </style>
  </defs>
  <g class="shell-window">
    <!-- Window Body -->
    <rect x="10" y="15" width="80" height="70" rx="10" fill="#24292E" stroke="#4EAA25" stroke-width="2.5"/>
    <!-- Title bar dots -->
    <circle cx="20" cy="25" r="3" fill="#FF5F56"/>
    <circle cx="28" cy="25" r="3" fill="#FFBD2E"/>
    <circle cx="36" cy="25" r="3" fill="#27C93F"/>
    <!-- Divider -->
    <line x1="10" y1="33" x2="90" y2="33" stroke="#3E444B" stroke-width="1.5"/>
    <!-- Terminal Prompt: >_ -->
    <path d="M22 47 L34 56 L22 65" fill="none" stroke="#4EAA25" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="cursor" x="42" y="61" width="16" height="5" rx="1" fill="#4EAA25"/>
  </g>
</svg>
