<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @keyframes tf-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes tf-pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      .tf-group {
        animation: tf-float 3.5s ease-in-out infinite;
      }
      .tf-accent {
        animation: tf-pulse 2s ease-in-out infinite;
      }
    </style>
  </defs>
  <g class="tf-group" transform="translate(10, 8) scale(0.8)">
    <!-- Terraform Left Diamond -->
    <polygon points="12,18 36,32 36,60 12,46" fill="#5C4EE5"/>
    <!-- Terraform Center Top Diamond -->
    <polygon class="tf-accent" points="38,33 62,47 62,75 38,61" fill="#7B42BC"/>
    <!-- Terraform Center Bottom Diamond -->
    <polygon points="38,5 62,19 62,47 38,33" fill="#844FBA"/>
    <!-- Terraform Right Diamond -->
    <polygon points="64,19 88,33 88,61 64,47" fill="#5C4EE5"/>
  </g>
</svg>
